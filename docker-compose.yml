services:
  postgres:
    image: postgres:16-alpine
    container_name: gains-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gains
      POSTGRES_PASSWORD: gains
      POSTGRES_DB: gains
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gains -d gains"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
